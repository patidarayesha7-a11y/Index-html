<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 500px;
            border: 3px solid;
           
        }
        .one{
            width: 100px;
            height: 100px;
             transition: 3s;
             border: 50%;
             transition-delay: 0.5s;
           
        }
        #one{
            background-color: rgb(235, 148, 166);
            transition-timing-function: linear;
        }
        #two{
            background-color: rgb(187, 138, 233);
            transition-timing-function:  ease-out;
        }
        #three{
            background-color: rgb(132, 178, 231);
            transition-timing-function: ease-in;
        }
         #four{
            background-color: rgb(232, 227, 130);
            transition-timing-function:ease-in-out;
        }
         #five{
            background-color: rgb(171, 245, 171);
            transition-timing-function: step-end;
        }
        #main:hover .one{
            margin-left: 1055px;
            border-radius: 50%;
           

        }
        #new{ transition: 3s;
       
  }
        #new:hover{
            transform: translateX(100px);
            

            transform: scale(2);
        }
    </style>
</head>
<body>
    <div id="main">
    <div id="one" class="one"></div>
    <div id="two" class="one"></div>
    <div id="three" class="one"></div>
    <div id="four" class="one"></div>
    <div id="five" class="one"></div>
    </div>
    <div id="new">heyyyy!!!!!1</div>
</body>
</html>
